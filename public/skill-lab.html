<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skill Lab · ดินแดนสวรรค์</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;700;800&family=Sarabun:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    { "imports": {
        "three": "./vendor/three/build/three.module.js",
        "three/addons/": "./vendor/three/addons/"
    } }
  </script>
  <style>
    body { overflow: auto; background: linear-gradient(#5fc8ff, #bfeeff 70%, #9ee08a 70%); }
    .lab { display: grid; grid-template-columns: 260px 1fr; gap: 16px; width: min(1120px, 96vw); margin: 20px auto; align-items: start; }
    .lab-side, .lab-main { padding: 16px; }
    .lab-title { width: min(1120px, 96vw); margin: 22px auto 0; }
    .lab-title .logo-title { font-size: 36px; }
    .lab-title p { color: var(--navy); font-weight: 700; }
    .lab-title a { color: var(--navy); }
    .skill-item { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 12px; cursor: pointer; border: 3px solid transparent; }
    .skill-item:hover, .skill-item.on { border-color: var(--gold-ink); background: linear-gradient(#fff3b8, var(--gold)); }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
    .grid2 label { display: block; color: var(--navy); font-size: 13px; font-weight: 700; }
    .grid2 input, .grid2 select { width: 100%; margin-top: 4px; padding: 7px 9px; border-radius: 10px; border: 2px solid #b6cdf0; background: #fff; color: var(--ink); font-weight: 600; }
    .grid2 input[type=range] { padding: 0; }
    .grid2 .full { grid-column: 1 / -1; }
    .range-val { color: var(--gold-ink); font-size: 12px; }
    #lab-preview { width: 100%; height: 280px; border-radius: 14px; border: 3px solid var(--navy); display: block; }
    .note { color: var(--muted); font-size: 13px; font-weight: 700; }
    .ok { color: #1f9d55; min-height: 1.2em; font-weight: 800; }
    .row { display: flex; gap: 10px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
    .btn-danger { color: var(--danger); }
    @media (max-width: 800px) { .lab { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="lab-title">
    <div class="logo-title">Skill Lab</div>
    <p>ออกแบบสกิลและเอฟเฟกต์ได้เอง พรีวิวสด แล้วบันทึกไว้ใช้ในเกม · <a href="index.html">กลับหน้าเกม</a></p>
  </div>

  <div class="lab">
    <aside class="lab-side panel">
      <label class="note">อาชีพ
        <select id="f-filter" style="width:100%;margin:6px 0 10px;padding:7px;border-radius:10px;border:2px solid #b6cdf0;font-weight:700"></select>
      </label>
      <div id="skill-list"></div>
      <div style="margin-top:10px"><button class="btn-yellow wide" id="btn-new">+ สร้างสกิลใหม่</button></div>
    </aside>

    <main class="lab-main panel">
      <canvas id="lab-preview"></canvas>
      <div class="row" style="margin-top:12px">
        <button class="btn-ghost small" id="btn-replay">▶ เล่นเอฟเฟกต์ซ้ำ</button>
        <label class="note">ทิศทาง
          <select id="f-dir" style="padding:6px 8px;border-radius:10px;border:2px solid #b6cdf0;font-weight:700">
            <option value="1,0">→ ขวา</option><option value="-1,0">← ซ้าย</option>
            <option value="0,-1">↑ บน</option><option value="0,1">↓ ล่าง</option>
          </select>
        </label>
      </div>

      <form id="form" class="grid2" style="margin-top:14px">
        <div><label>ชื่อสกิล<input id="f-name" maxlength="40" required></label></div>
        <div><label>ไอคอน (emoji)<input id="f-icon" maxlength="4"></label></div>
        <div><label>อาชีพ<select id="f-class"></select></label></div>
        <div><label>ปุ่มลัด (1-6)<select id="f-key"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></label></div>
        <div><label>คูลดาวน์ (ms)<input id="f-cooldown" type="number" min="100" max="60000" step="100"></label></div>
        <div><label>MP ที่ใช้<input id="f-mp" type="number" min="0" max="999"></label></div>
        <div><label>ดาเมจ<input id="f-damage" type="number" min="0" max="99999"></label></div>
        <div><label>ระยะ (px)<input id="f-range" type="number" min="20" max="800"></label></div>

        <div class="full"><hr style="border:0;border-top:2px solid #d5e4fb"><b style="color:var(--navy)">เอฟเฟกต์</b></div>
        <div><label>รูปแบบ<select id="f-type">
          <option value="burst">burst · ระเบิดรอบตัว</option>
          <option value="nova">nova · วงคลื่น</option>
          <option value="slash">slash · ฟันโค้ง</option>
          <option value="projectile">projectile · ลูกพุ่ง</option>
          <option value="beam">beam · ลำแสง</option>
          <option value="heal">heal · พุ่งขึ้น</option>
        </select></label></div>
        <div><label>ระยะเวลา (ms)<input id="f-duration" type="number" min="100" max="5000" step="50"></label></div>
        <div><label>สีหลัก<input id="f-color" type="color"></label></div>
        <div><label>สีรอง<input id="f-color2" type="color"></label></div>
        <div><label>จำนวนอนุภาค <span class="range-val" id="v-count"></span><input id="f-count" type="range" min="1" max="200"></label></div>
        <div><label>ขนาด <span class="range-val" id="v-size"></span><input id="f-size" type="range" min="1" max="60"></label></div>
        <div><label>ความเร็ว <span class="range-val" id="v-speed"></span><input id="f-speed" type="range" min="10" max="1000"></label></div>
        <div><label>สั่นจอ <span class="range-val" id="v-shake"></span><input id="f-shake" type="range" min="0" max="20"></label></div>

        <div class="full row" style="margin-top:6px">
          <button type="button" class="btn-ghost small btn-danger" id="btn-delete">ลบสกิลนี้</button>
          <button type="button" class="btn-ghost small" id="btn-reset">คืนค่าเริ่มต้น</button>
          <button type="submit" class="btn-yellow" id="btn-save">บันทึกสกิล</button>
        </div>
        <div class="full ok" id="save-msg"></div>
        <div class="full error" id="save-err"></div>
      </form>
    </main>
  </div>

  <script type="module" src="js/skill-lab.js"></script>
</body>
</html>
