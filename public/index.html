<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>ดินแดนสวรรค์ · Sky Realm</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;700;800&family=Sarabun:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    { "imports": {
        "three": "./vendor/three/build/three.module.js",
        "three/addons/": "./vendor/three/addons/"
    } }
  </script>
</head>
<body>
  <canvas id="bg-canvas"></canvas>

  <div id="ui">
    <!-- splash -->
    <section id="splash" class="screen active">
      <div class="splash-logo">
        <div class="logo-title">ดินแดนสวรรค์</div>
        <div class="logo-sub">SKY REALM</div>
      </div>
      <div class="progress"><div id="splash-bar"></div></div>
      <p class="tip" id="splash-tip">กำลังโหลดข้อมูล...</p>
    </section>

    <!-- login -->
    <section id="login" class="screen">
      <div class="brand">
        <div class="logo-title big">ดินแดนสวรรค์</div>
        <div class="logo-sub">SKY REALM · เกม MMORPG บนเว็บ</div>
      </div>
      <div class="login-panel panel">
        <h2>เข้าสู่เกม</h2>
        <div id="google-btn" class="google-slot"></div>
        <button class="btn-yellow wide" id="btn-guest">เล่นแบบ Guest</button>
        <p class="hint" id="login-hint"></p>
        <p class="error" id="login-error"></p>
      </div>
      <div class="bottom-links">
        <a class="btn-ghost small" href="character-lab.html">Character Lab</a>
        <a class="btn-ghost small" href="skill-lab.html">Skill Lab</a>
      </div>
    </section>

    <!-- character select -->
    <section id="charselect" class="screen">
      <aside class="side-panel panel">
        <div class="panel-head">เลือกตัวละคร</div>
        <div class="server-row"><span class="server-badge">🌿</span><b>ดินแดนสวรรค์</b><span class="server-tag">เซิร์ฟเวอร์ 1</span></div>
        <div id="char-list" class="char-list"></div>
        <div class="select-foot">
          <button class="icon-btn" id="btn-delete-char" title="ลบตัวละคร"><span class="ico">🗑️</span>ลบ</button>
          <button class="btn-yellow big" id="btn-start">เริ่มเกม</button>
          <button class="icon-btn" id="btn-new-char" title="สร้างตัวละคร"><span class="ico">＋</span>สร้าง</button>
        </div>
        <p class="error" id="charselect-error"></p>
      </aside>
      <div class="bottom-left-btns">
        <button class="btn-ghost small" id="btn-logout">🚪 ออกจากเกม</button>
      </div>
    </section>

    <!-- creator -->
    <section id="creator" class="screen">
      <div class="designer panel" id="designer"></div>
    </section>

    <!-- enter-world loader -->
    <section id="enter-loader" class="screen">
      <div class="enter-box panel">
        <h2 id="enter-title">กำลังเข้าสู่ ดินแดนสวรรค์</h2>
        <div class="progress wide"><div id="enter-bar"></div></div>
        <p class="tip" id="enter-tip"></p>
      </div>
    </section>

    <!-- world HUD -->
    <section id="game" class="screen">
      <div class="hud-player panel">
        <div class="portrait"><canvas id="portrait" width="128" height="128"></canvas></div>
        <div class="pbars">
          <div class="pname"><span id="hud-name"></span><span class="lv" id="hud-lv"></span></div>
          <div class="pclass" id="hud-class"></div>
          <div class="bar hp"><div id="bar-hp"></div><span id="txt-hp"></span></div>
          <div class="bar mp"><div id="bar-mp"></div><span id="txt-mp"></span></div>
        </div>
      </div>

      <div class="hud-quest panel">
        <div class="quest-title">📜 เส้นหลัก: เจตนารมณ์แห่งสวรรค์</div>
        <div class="quest-step" id="quest-step"></div>
      </div>

      <div class="hud-topright" id="hud-topright"></div>
      <div class="hud-bottomleft" id="hud-bottomleft"></div>
      <div class="hud-skills" id="hud-skills"></div>

      <div class="hud-chat">
        <div id="chat-log"></div>
        <input id="chat-input" maxlength="120" placeholder="กด Enter เพื่อพิมพ์แชต">
      </div>

      <div class="window panel" id="window" hidden>
        <div class="window-head"><span id="window-title"></span><button id="window-close" class="close">✕</button></div>
        <div class="window-body" id="window-body"></div>
      </div>
      <div class="toast panel" id="toast" hidden></div>
    </section>
  </div>

  <div id="float-layer"></div>
  <script type="module" src="js/screens.js"></script>
</body>
</html>
