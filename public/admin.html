<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ผู้ดูแลระบบ · ดินแดนสวรรค์</title>
  <style>
    :root { --ink: #1b2a4e; --muted: #6b7aa0; --line: #dfe6f5; --accent: #3fb0ff; --bad: #ff4f6e; --ok: #14b87c; --bg: #f4f7fd; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Kanit", "Sarabun", system-ui, sans-serif; color: var(--ink); background: var(--bg); }
    header { display: flex; align-items: center; gap: 14px; padding: 14px 22px; background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; }
    header h1 { font-size: 18px; margin: 0; }
    header .sp { flex: 1; }
    main { max-width: 1180px; margin: 0 auto; padding: 18px; display: grid; gap: 16px; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
    .card h2 { font-size: 15px; margin: 0 0 12px; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .stat { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
    .stat span { color: var(--muted); font-size: 12px; }
    .stat b { display: block; font-size: 22px; margin-top: 2px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    th { color: var(--muted); font-weight: 600; font-size: 12px; }
    input, select, textarea, button { font: inherit; }
    input, select, textarea { border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; background: #fff; color: var(--ink); }
    textarea { width: 100%; min-height: 70px; }
    button { border: 0; border-radius: 10px; padding: 7px 12px; cursor: pointer; background: #eef3ff; color: var(--ink); font-weight: 600; }
    button.primary { background: linear-gradient(120deg, #3fb0ff, #9d7bff); color: #fff; }
    button.danger { background: #ffecef; color: var(--bad); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; }
    .open { background: #e4f8ef; color: var(--ok); }
    .maintenance { background: #fff4e0; color: #b7770e; }
    .closed { background: #ffecef; color: var(--bad); }
    .muted { color: var(--muted); font-size: 12px; }
    #msg { min-height: 20px; font-size: 13px; }
    #msg.err { color: var(--bad); }
    #msg.ok { color: var(--ok); }
    @media (max-width: 720px) { .stats { grid-template-columns: 1fr 1fr; } table { font-size: 12px; } }
  </style>
</head>
<body>
  <header>
    <h1>ผู้ดูแลระบบ · ดินแดนสวรรค์</h1>
    <span class="sp"></span>
    <input id="token" type="password" placeholder="รหัสผู้ดูแล (ADMIN_TOKEN)" size="26">
    <button class="primary" id="login">เข้าใช้งาน</button>
  </header>
  <main>
    <p id="msg"></p>

    <section class="stats" id="stats"></section>

    <section class="card">
      <h2>เซิร์ฟเวอร์</h2>
      <div class="row" style="margin-bottom:10px">
        <input id="new-server" placeholder="ชื่อเซิร์ฟเวอร์ใหม่" size="24">
        <button class="primary" id="create-server">สร้างเซิร์ฟเวอร์</button>
      </div>
      <table>
        <thead><tr><th>ชื่อ</th><th>รหัส</th><th>สถานะ</th><th>ผู้เล่น</th><th>จัดการ</th></tr></thead>
        <tbody id="servers"></tbody>
      </table>
    </section>

    <section class="card">
      <h2>ตัวละคร</h2>
      <div class="row" style="margin-bottom:10px">
        <select id="char-server"></select>
        <input id="char-q" placeholder="ค้นหาชื่อตัวละคร" size="20">
        <button id="char-search">ค้นหา</button>
      </div>
      <table>
        <thead><tr><th>ชื่อ</th><th>ผู้เล่น</th><th>อาชีพ</th><th>เลเวล</th><th>เหรียญ</th><th>VIP ถึง</th><th>จัดการ</th></tr></thead>
        <tbody id="characters"></tbody>
      </table>
    </section>

    <section class="card">
      <h2>ประกาศ (แสดงในเกม)</h2>
      <div class="row" style="margin-bottom:8px">
        <input id="ann-title" placeholder="หัวข้อ" size="30">
        <select id="ann-server"><option value="">ทุกเซิร์ฟเวอร์</option></select>
        <label class="muted"><input type="checkbox" id="ann-active" checked> แสดงทันที</label>
      </div>
      <textarea id="ann-body" placeholder="เนื้อหาประกาศ"></textarea>
      <div class="row" style="margin:8px 0 14px"><button class="primary" id="ann-create">เผยแพร่ประกาศ</button></div>
      <table>
        <thead><tr><th>หัวข้อ</th><th>เซิร์ฟเวอร์</th><th>สถานะ</th><th>วันที่</th><th>จัดการ</th></tr></thead>
        <tbody id="announcements"></tbody>
      </table>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const STATUS_TH = { open: 'เปิด', maintenance: 'ปรับปรุง', closed: 'ปิด' };
    const CLASS_TH = { swordsman: 'นักดาบ', assassin: 'นักฆ่า', mage: 'นักเวทย์', priest: 'นักพรต' };
    let token = sessionStorage.getItem('sr_admin_token') || '';
    let servers = [];

    const msg = (text, cls = '') => { $('msg').textContent = text; $('msg').className = cls; };

    async function api(method, path, body) {
      const res = await fetch(path, {
        method,
        headers: { 'X-Admin-Token': token, ...(body ? { 'Content-Type': 'application/json' } : {}) },
        body: body ? JSON.stringify(body) : undefined,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'HTTP ' + res.status);
      return data;
    }

    async function run(fn, ok) {
      try { await fn(); if (ok) msg(ok, 'ok'); } catch (e) { msg(e.message, 'err'); }
    }

    async function loadAll() {
      const ov = await api('GET', '/api/admin/overview');
      servers = ov.servers;
      $('stats').innerHTML = [
        ['เซิร์ฟเวอร์', servers.length], ['ผู้เล่น (บัญชี)', ov.users], ['ตัวละคร', ov.characters], ['ประกาศ', ov.announcements],
      ].map(([l, v]) => `<div class="stat"><span>${l}</span><b>${v}</b></div>`).join('');
      $('servers').innerHTML = servers.map((s) => `
        <tr>
          <td><b>${esc(s.name)}</b></td><td class="muted">${s.id}</td>
          <td><select data-status="${s.id}">${Object.entries(STATUS_TH).map(([v, t]) => `<option value="${v}" ${s.status === v ? 'selected' : ''}>${t}</option>`).join('')}</select>
            <span class="pill ${s.status}">${STATUS_TH[s.status]}</span></td>
          <td>${s.population}</td>
          <td class="row">
            <button data-rename="${s.id}">เปลี่ยนชื่อ</button>
            <select data-merge-to="${s.id}"><option value="">รวมไปที่...</option>${servers.filter((x) => x.id !== s.id).map((x) => `<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select>
            <button data-merge="${s.id}" ${s.population === 0 ? 'disabled' : ''}>รวม</button>
            <button class="danger" data-delete="${s.id}" ${s.population > 0 || servers.length === 1 ? 'disabled' : ''}>ลบ</button>
          </td>
        </tr>`).join('');
      const opts = servers.map((s) => `<option value="${s.id}">${esc(s.name)}</option>`).join('');
      const cur = $('char-server').value;
      $('char-server').innerHTML = opts;
      if (cur) $('char-server').value = cur;
      $('ann-server').innerHTML = '<option value="">ทุกเซิร์ฟเวอร์</option>' + opts;
      await loadCharacters();
      await loadAnnouncements();
    }

    async function loadCharacters() {
      const q = encodeURIComponent($('char-q').value.trim());
      const server = encodeURIComponent($('char-server').value);
      const { characters } = await api('GET', `/api/admin/characters?server=${server}&q=${q}`);
      $('characters').innerHTML = characters.map((c) => `
        <tr>
          <td><b>${esc(c.name)}</b></td><td class="muted">${esc(c.userName)}</td>
          <td>${CLASS_TH[c.classId] || c.classId}${c.job ? ' · ' + esc(c.job) : ''}</td>
          <td>${c.level}</td><td>${c.gold.toLocaleString('th-TH')}</td>
          <td>${c.vipUntil ? new Date(c.vipUntil).toLocaleDateString('th-TH') : '-'}</td>
          <td class="row">
            <button data-gold="${c.id}">+เหรียญ</button>
            <button data-vip="${c.id}">+VIP 30 วัน</button>
            <button data-item="${c.id}">+ของ</button>
            <button class="danger" data-del-char="${c.id}">ลบ</button>
          </td>
        </tr>`).join('') || '<tr><td colspan="7" class="muted">ไม่มีตัวละคร</td></tr>';
    }

    async function loadAnnouncements() {
      const { announcements } = await api('GET', '/api/admin/announcements');
      $('announcements').innerHTML = announcements.map((a) => `
        <tr>
          <td><b>${esc(a.title)}</b><div class="muted">${esc(a.body)}</div></td>
          <td>${a.serverId ? esc((servers.find((s) => s.id === a.serverId) || {}).name || a.serverId) : 'ทุกเซิร์ฟเวอร์'}</td>
          <td><span class="pill ${a.active ? 'open' : 'closed'}">${a.active ? 'แสดงอยู่' : 'ซ่อน'}</span></td>
          <td class="muted">${new Date(a.createdAt).toLocaleString('th-TH')}</td>
          <td class="row">
            <button data-toggle-ann="${a.id}" data-active="${a.active}">${a.active ? 'ซ่อน' : 'แสดง'}</button>
            <button class="danger" data-del-ann="${a.id}">ลบ</button>
          </td>
        </tr>`).join('') || '<tr><td colspan="5" class="muted">ยังไม่มีประกาศ</td></tr>';
    }

    // one click handler for every table action
    document.addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      const d = b.dataset;
      if (d.rename) return run(async () => {
        const name = prompt('ชื่อเซิร์ฟเวอร์ใหม่');
        if (!name) return;
        await api('PATCH', `/api/admin/servers/${d.rename}`, { name });
        await loadAll();
      }, 'เปลี่ยนชื่อแล้ว');
      if (d.merge) return run(async () => {
        const into = document.querySelector(`[data-merge-to="${d.merge}"]`).value;
        if (!into) throw new Error('เลือกเซิร์ฟเวอร์ปลายทางก่อน');
        if (!confirm('ย้ายตัวละครทั้งหมดไปเซิร์ฟเวอร์ปลายทาง แล้วลบเซิร์ฟเวอร์นี้ ดำเนินการต่อหรือไม่')) return;
        const r = await api('POST', `/api/admin/servers/${d.merge}/merge`, { into });
        msg(`ย้าย ${r.moved} ตัวละครแล้ว`, 'ok');
        await loadAll();
      });
      if (d.delete) return run(async () => {
        if (!confirm('ลบเซิร์ฟเวอร์นี้ถาวร?')) return;
        await api('DELETE', `/api/admin/servers/${d.delete}`);
        await loadAll();
      }, 'ลบเซิร์ฟเวอร์แล้ว');
      if (d.gold) return run(async () => {
        const n = Number(prompt('จำนวนเหรียญที่จะเพิ่ม (ใส่ลบเพื่อหัก)', '1000'));
        if (!Number.isInteger(n) || n === 0) return;
        await api('PATCH', `/api/admin/characters/${d.gold}`, { gold: n });
        await loadCharacters();
      }, 'ปรับเหรียญแล้ว');
      if (d.vip) return run(async () => {
        await api('PATCH', `/api/admin/characters/${d.vip}`, { vipDays: 30 });
        await loadCharacters();
      }, 'ให้ VIP 30 วันแล้ว');
      if (d.item) return run(async () => {
        const id = prompt('รหัสไอเท็ม เช่น potion_hp, enh_stone, spirit_orb_epic, rune_atk_2', 'potion_hp');
        if (!id) return;
        const n = Number(prompt('จำนวน', '5'));
        if (!Number.isInteger(n) || n < 1) return;
        await api('PATCH', `/api/admin/characters/${d.item}`, { mats: { [id.trim()]: n } });
        await loadCharacters();
      }, 'ให้ไอเท็มแล้ว');
      if (d.delChar) return run(async () => {
        if (!confirm('ลบตัวละครนี้ถาวร?')) return;
        await api('DELETE', `/api/admin/characters/${d.delChar}`);
        await loadCharacters();
      }, 'ลบตัวละครแล้ว');
      if (d.toggleAnn) return run(async () => {
        await api('PATCH', `/api/admin/announcements/${d.toggleAnn}`, { active: d.active !== 'true' });
        await loadAnnouncements();
      });
      if (d.delAnn) return run(async () => {
        if (!confirm('ลบประกาศนี้?')) return;
        await api('DELETE', `/api/admin/announcements/${d.delAnn}`);
        await loadAnnouncements();
      }, 'ลบประกาศแล้ว');
    });

    document.addEventListener('change', (e) => {
      const st = e.target.dataset.status;
      if (st) run(async () => { await api('PATCH', `/api/admin/servers/${st}`, { status: e.target.value }); await loadAll(); }, 'เปลี่ยนสถานะแล้ว');
    });

    $('login').addEventListener('click', () => run(async () => {
      token = $('token').value.trim();
      sessionStorage.setItem('sr_admin_token', token);
      await loadAll();
      msg('เข้าใช้งานแล้ว', 'ok');
    }));
    $('create-server').addEventListener('click', () => run(async () => {
      const name = $('new-server').value.trim();
      await api('POST', '/api/admin/servers', { name });
      $('new-server').value = '';
      await loadAll();
    }, 'สร้างเซิร์ฟเวอร์แล้ว'));
    $('char-search').addEventListener('click', () => run(loadCharacters));
    $('ann-create').addEventListener('click', () => run(async () => {
      await api('POST', '/api/admin/announcements', {
        title: $('ann-title').value, body: $('ann-body').value,
        serverId: $('ann-server').value || null, active: $('ann-active').checked,
      });
      $('ann-title').value = ''; $('ann-body').value = '';
      await loadAnnouncements();
    }, 'เผยแพร่ประกาศแล้ว'));

    if (token) {
      $('token').value = token;
      run(loadAll);
    }
  </script>
</body>
</html>
