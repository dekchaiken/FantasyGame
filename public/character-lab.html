<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Character Lab · ดินแดนสวรรค์</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;700;800&family=Sarabun:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    { "imports": {
        "three": "./vendor/three/build/three.module.js",
        "three/addons/": "./vendor/three/addons/"
    } }
  </script>
  <style>
    .lab-title { position: absolute; left: 4%; top: 4%; pointer-events: auto; }
    .lab-title .logo-title { font-size: 38px; }
    .lab-title p { margin: 8px 0 0; color: var(--navy); font-weight: 700; text-shadow: 0 1px 0 #fff; }
    .lab-title a { color: var(--navy); font-weight: 800; }
    .export-box {
      position: absolute;
      left: 4%;
      bottom: 4%;
      width: min(440px, 60vw);
      padding: 14px;
      pointer-events: auto;
    }
    .export-box textarea {
      width: 100%;
      height: 160px;
      border-radius: 12px;
      border: 3px solid #b6cdf0;
      padding: 10px;
      font-family: ui-monospace, Menlo, monospace;
      font-size: 12px;
      color: var(--ink);
      resize: vertical;
    }
    .export-box h3 { color: var(--navy); margin-bottom: 8px; }
    #ui > .designer { pointer-events: auto; }
  </style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <div id="ui">
    <div class="lab-title">
      <div class="logo-title">Character Lab</div>
      <p>ออกแบบตัวละครได้เอง แล้วคัดลอก JSON ไปใช้งาน · <a href="index.html">กลับหน้าเกม</a></p>
    </div>
    <div class="designer panel" id="designer"></div>
    <div class="export-box panel">
      <h3>ผลลัพธ์ (JSON)</h3>
      <textarea id="export-json" readonly></textarea>
    </div>
  </div>
  <script type="module" src="js/character-lab.js"></script>
</body>
</html>
